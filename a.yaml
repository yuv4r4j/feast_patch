apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: repo-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: streamlit-git-sync-pod
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 600
  volumes:
    - name: repo-data
      persistentVolumeClaim:
        claimName: repo-data-pvc
  initContainers:
    - name: git-sync-repo1
      image: registry.k8s.io/git-sync/git-sync:v4.2.1
      env:
        - name: GITSYNC_REPO
          value: "https://github.com/org/repo1.git"
        - name: GITSYNC_ROOT
          value: "/repos/repo1"
        - name: GITSYNC_LINK
          value: "current"
        - name: GITSYNC_ONE_TIME
          value: "true"
        - name: GITSYNC_DEPTH
          value: "1"
      volumeMounts:
        - name: repo-data
          mountPath: /repos
    - name: git-sync-repo2
      image: registry.k8s.io/git-sync/git-sync:v4.2.1
      env:
        - name: GITSYNC_REPO
          value: "https://github.com/org/repo2.git"
        - name: GITSYNC_ROOT
          value: "/repos/repo2"
        - name: GITSYNC_LINK
          value: "current"
        - name: GITSYNC_ONE_TIME
          value: "true"
        - name: GITSYNC_DEPTH
          value: "1"
      volumeMounts:
        - name: repo-data
          mountPath: /repos
    - name: git-sync-repo3
      image: registry.k8s.io/git-sync/git-sync:v4.2.1
