        - name: GITSYNC_ROOT
          value: "/repos/repo3"
        - name: GITSYNC_LINK
          value: "current"
        - name: GITSYNC_ONE_TIME
          value: "true"
        - name: GITSYNC_DEPTH
          value: "1"
      volumeMounts:
        - name: repo-data
          mountPath: /repos
    - name: git-sync-repo4
      image: registry.k8s.io/git-sync/git-sync:v4.2.1
