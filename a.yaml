  containers:
    - name: streamlit
      image: python:3.11-slim
      command: ["/bin/sh", "-c"]
      args:
        - |
          pip install streamlit &&
          mkdir -p /app &&
          for i in $(seq 1 10); do
            cp -r /repos/repo${i}/current /app/repo${i}
          done &&
          cd /app/repo1 &&
          streamlit run app.py --server.port=8501 --server.address=0.0.0.0
      ports:
        - containerPort: 8501
      volumeMounts:
        - name: repo-data
          mountPath: /repos
